name: ci
on:
  push: {branches: [main, "release/**"]}
  pull_request:
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          pip install "fastapi>=0.115" "uvicorn[standard]" "sqlalchemy>=2" "psycopg[binary]" alembic pydantic-settings \
            "pyjwt[crypto]" boto3 redis httpx python-multipart email-validator pytest pytest-cov ruff \
            numpy opencv-python-headless
      - name: Lint
        run: |
          cd services/api && ruff check .
          cd ../worker && ruff check .
      - name: Migrations are reversible
        working-directory: services/api
        env: {APP_ENV: test, APP_DATABASE_URL: "postgresql+psycopg://app:app@localhost:5432/app_test"}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: API + integration tests
        working-directory: services/api
        env: {APP_DATABASE_URL: "postgresql+psycopg://app:app@localhost:5432/app_test"}
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Worker tests
        working-directory: services/worker
        run: python -m pytest -q
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  images:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t api:ci .
      - run: docker build -f infra/docker/worker-cpu.Dockerfile -t worker:ci .
      - uses: aquasecurity/trivy-action@v0.28.0
        with: {image-ref: "api:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test --if-present
