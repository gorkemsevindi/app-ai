# Local development: `make up` then `make seed`. Everything runs without a GPU (mock models).
# For a real GPU worker: `docker compose --profile gpu up worker-gpu` on a CUDA host.
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-dev-password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio minio-dev-password; do sleep 1; done;
             mc mb -p local/aivideo-private; mc anonymous set none local/aivideo-private"
  migrate:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
  worker:
    build: {context: ., dockerfile: infra/docker/worker-cpu.Dockerfile}
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token-change-me}
      WORKER_ID: dev-cpu-1
    depends_on: [api]
  worker-gpu:
    profiles: [gpu]
    build: {context: ., dockerfile: infra/docker/worker-gpu.Dockerfile}
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-token-change-me}
      WORKER_MODELS: dreamid_v,wan22_ti2v_5b,mp_analyzer,dreamid_v_mp
      GPU_PROVIDER: local
      WORKER_ENV: dev
    volumes: [./models:/models:ro]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
volumes: {pgdata: {}, minio: {}}
